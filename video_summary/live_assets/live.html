<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>即時收音逐字稿｜Video Summary</title>
    <link rel="stylesheet" href="/live-assets/theme.css" />
    <link rel="stylesheet" href="/live-assets/live.css" />
  </head>
  <body>
    <header class="app-topbar">
      <div class="app-topbar-inner">
        <a class="app-brand" href="/">Video Summary</a>
        <nav class="feature-nav" aria-label="功能切換">
          <a href="/">影音檔案／YouTube 摘要</a>
          <a class="active" href="/live">即時收音逐字稿</a>
        </nav>
      </div>
    </header>

    <main class="page-shell">
      <section class="app-intro">
        <p class="app-eyebrow">本機即時轉錄</p>
        <h1>麥克風與螢幕音訊逐字稿</h1>
        <p>瀏覽器每約 20 秒傳送一段音訊至你選擇的 AI 服務，結果會依序顯示在此頁。</p>
      </section>

      <section class="app-card settings-card">
        <div class="section-heading"><span class="step-badge">1</span><h2>AI 設定</h2></div>
        <div class="grid two-columns">
          <label>
            <span>AI 服務</span>
            <select id="provider">
              <option value="gemini">Gemini</option>
              <option value="openai">OpenAI</option>
            </select>
          </label>
          <label>
            <span>API Key</span>
            <input id="api-key" type="password" autocomplete="off" placeholder="僅保留在目前瀏覽器頁面" />
            <small id="key-hint">也可使用 .env 中已設定的 Key</small>
          </label>
          <label>
            <span>主要語言</span>
            <select id="language">
              <option value="auto">自動偵測</option>
              <option value="zh" selected>繁體中文</option>
              <option value="en">英文</option>
              <option value="ja">日文</option>
            </select>
          </label>
          <label id="gemini-model-field">
            <span>Gemini 模型</span>
            <input id="gemini-model" type="text" />
          </label>
          <label id="openai-model-field" hidden>
            <span>OpenAI 轉錄模型</span>
            <select id="openai-model">
              <option value="gpt-4o-transcribe">gpt-4o-transcribe</option>
              <option value="gpt-4o-mini-transcribe">gpt-4o-mini-transcribe</option>
              <option value="gpt-4o-transcribe-diarize">gpt-4o-transcribe-diarize</option>
              <option value="whisper-1">whisper-1</option>
            </select>
          </label>
        </div>
      </section>

      <section class="app-card controls-card">
        <div class="section-heading"><span class="step-badge">2</span><h2>開始收音</h2></div>
        <div class="actions">
          <button id="mic-button" class="primary" disabled>🎙 麥克風收音</button>
          <button id="screen-button" class="primary" disabled>▣ 分頁／視窗／螢幕收音</button>
          <button id="mixed-button" class="primary" disabled>◉ 會議混合收音</button>
          <button id="stop-button" class="danger" disabled>■ 停止收音</button>
          <button id="clear-button" class="secondary">清除記錄</button>
          <button id="download-button" class="secondary">↓ 下載 Markdown</button>
        </div>
        <p class="app-notice">
          開始收音前，必須先輸入目前 AI 服務的 API Key，或在 `.env` 完成設定。<br />
          「會議混合收音」會同時錄製你的麥克風與分享來源。請優先選擇瀏覽器分頁並勾選
          「分享分頁音訊」；建議戴耳機，避免喇叭聲再次進入麥克風。本功能只取音訊，
          不會保存螢幕畫面。
        </p>
      </section>

      <section class="status-card" aria-live="polite">
        <span id="status-dot"></span>
        <strong id="status-text">尚未開始收音</strong>
        <span id="timer">00:00:00</span>
      </section>

      <section class="app-card transcript-card">
        <div class="transcript-heading">
          <div class="section-heading"><span class="step-badge">3</span><h2>即時逐字稿</h2></div>
          <span id="chunk-status"></span>
        </div>
        <div id="transcript" class="transcript-empty">開始收音後，逐字稿會顯示在這裡。</div>
      </section>
    </main>

    <script src="/live-assets/live.js" defer></script>
  </body>
</html>
